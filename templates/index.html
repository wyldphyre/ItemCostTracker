{{template "base.html" .}}
{{define "content"}}
<div class="table-wrapper">
  {{if .Items}}
  <table>
    <thead>
      <tr>
        <th class="col-name">Item</th>
        <th class="col-tile col-purchase-resale">Purchase and Resale</th>
        <th class="col-tile col-cost-per">Cost Per</th>
        <th class="col-tile col-projected">Projected Costs</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody id="items-table-body">
      {{range .Items}}
        {{template "item_row" .}}
      {{end}}
    </tbody>
  </table>
  {{else}}
  <div class="empty-state">
    <p>No items yet. Click <strong>+ Add Item</strong> to get started.</p>
  </div>
  {{end}}
</div>
{{end}}
