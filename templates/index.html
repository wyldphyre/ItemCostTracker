{{template "base.html" .}}
{{define "content"}}
<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th class="col-name">Item</th>
        <th class="col-tile col-purchase-resale">Purchase and Resale</th>
        <th class="col-tile col-cost-per">Cost Per</th>
        <th class="col-tile col-projected">Projected Costs</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <!-- The tbody is always rendered, even when empty: every mutating form
         targets #items-table-body, so the element must exist for HTMX to
         resolve its target. -->
    <tbody id="items-table-body">
      {{range .Items}}
        {{template "item_row" .}}
      {{else}}
        {{template "empty_row"}}
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
