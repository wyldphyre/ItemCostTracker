<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Cost Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- htmx 2.0.4, vendored into static/ so the app works with no internet
       access. Verified identical to the unpkg build it replaced:
       sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+ -->
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <h1>Item Cost Tracker <span class="version">v{{version}}</span></h1>
    <input type="search" id="search-input" placeholder="Search items…" autocomplete="off"
           oninput="applyFilters()" onkeydown="handleSearchKeydown(event)">
    <div class="header-actions">
      <button id="btn-filter-active" onclick="toggleActiveFilter()">Active only</button>
      <button hx-get="/import"
              hx-target="#modal-content"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful){document.getElementById('modal').showModal()}">
        Import
      </button>
      <a href="/export/json" class="btn hide-mobile">Export JSON</a>
      <a href="/export/csv" class="btn hide-mobile">Export CSV</a>
      <button class="btn-primary"
              hx-get="/items/new"
              hx-target="#modal-content"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful){document.getElementById('modal').showModal()}">
        + Add Item
      </button>
    </div>
  </header>

  <main>
    <div id="page-error" class="page-error" role="alert" hidden></div>
    {{block "content" .}}{{end}}
  </main>

  <dialog id="modal">
    <div id="modal-content"></div>
  </dialog>
<script>
  function handleSearchKeydown(e) {
    if (e.key !== 'Escape') return;
    // Clear and re-filter ourselves. preventDefault stops the native clear,
    // but some browsers (e.g. Vivaldi) still blur the search field on Escape
    // at the browser level — re-assert focus on the next frame, after the
    // browser has had its turn, so the field stays focused.
    e.preventDefault();
    e.stopPropagation();
    const input = e.currentTarget;
    input.value = '';
    applyFilters();
    requestAnimationFrame(function () { input.focus(); });
  }
  function applyFilters() {
    const activeOnly = document.getElementById('btn-filter-active').classList.contains('filter-on');
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    document.querySelectorAll('#items-table-body tr').forEach(function(row) {
      // The "No items yet" row is true regardless of filters; never hide it.
      if (row.classList.contains('empty-row')) return;
      const name = row.querySelector('.col-name');
      const matchesSearch = !query || (name && name.textContent.trim().toLowerCase().includes(query));
      const matchesFilter = !activeOnly || row.classList.contains('active');
      row.style.display = (matchesSearch && matchesFilter) ? '' : 'none';
    });
  }
  function toggleActiveFilter() {
    document.getElementById('btn-filter-active').classList.toggle('filter-on');
    applyFilters();
  }
  // Reapply both filters after HTMX re-renders the table body
  document.addEventListener('htmx:afterSettle', function(e) {
    if (e.target.id === 'items-table-body') applyFilters();
  });

  // htmx does not swap 4xx/5xx responses, so without this a rejected save or a
  // failed delete would just appear to do nothing. Show the server's message in
  // the open modal's error box if there is one, otherwise above the table.
  function errorBox() {
    const modal = document.getElementById('modal');
    return (modal.open && modal.querySelector('.form-error')) || document.getElementById('page-error');
  }
  function showError(message) {
    const box = errorBox();
    box.textContent = message;
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('htmx:beforeRequest', function() {
    document.querySelectorAll('.form-error, #page-error').forEach(function(box) { box.hidden = true; });
  });
  document.addEventListener('htmx:responseError', function(e) {
    const text = (e.detail.xhr.responseText || '').trim();
    showError(text || ('Request failed (HTTP ' + e.detail.xhr.status + ').'));
  });
  document.addEventListener('htmx:sendError', function() {
    showError('Could not reach the server. Check your connection and try again.');
  });
</script>
</body>
</html>
