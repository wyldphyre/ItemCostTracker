{{define "item_actions"}}
<button class="btn-sm"
        hx-get="/items/{{.ID}}/edit"
        hx-target="#modal-content"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful){document.getElementById('modal').showModal()}">Edit</button>
<button class="btn-sm btn-danger"
        hx-get="/items/{{.ID}}/confirm-delete"
        hx-target="#actions-{{.ID}}"
        hx-swap="innerHTML">Delete</button>
{{end}}
