{{define "cost_row"}}
{{/* Rows are paired by position on the server, so field names carry no index:
     removing, re-adding, or leaving a row blank can't disturb the others. */}}
<div class="cost-row">
  <input type="text"
         name="cost_description"
         placeholder="Description (e.g. Accessories, Insurance)"
         value="{{.Description}}">
  <input type="number"
         name="cost_amount"
         step="any"
         placeholder="Amount (negative = credit)"
         value="{{formatNumberInput .Amount}}">
  <button type="button" class="btn-remove-cost" onclick="this.closest('.cost-row').remove()">×</button>
</div>
{{end}}
